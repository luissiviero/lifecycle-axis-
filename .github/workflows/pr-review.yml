name: pr-review
# T20 (docs/sdlc/spikes/pr-review-identity.md, decisions 1-3): advisory-only PR review.
# The action posts as claude[bot] (Claude GitHub App via anthropic_api_key) and never
# approves -- findings are advisory, and approval stays a human act recorded in
# work/<slug>/log.md (validated by scripts/check_artifact_chain.py). Two triggers: a normal
# PR review pass, and an on-demand re-review via an "@claude" comment on the PR.
#
# Security review fixes: the on-demand trigger requires the commenter to be an owner, member
# or collaborator (finding 5); the checkout targets the PR head on both triggers; and the
# reviewer executes no PR-head code at all (no Bash), because the action's process holds the
# API key and an eval case or script from the PR could exfiltrate it (finding 4). The
# Chain/Verify evidence comes from the sdlc-gate workflow's check run instead.
#
# How the findings reach the PR without Bash: `track_progress: true` makes the action open a
# tracking comment as claude[bot] before Claude starts and hands Claude the
# `mcp__github_comment__update_claude_comment` tool, so the final report replaces that comment;
# `mcp__github_inline_comment__create_inline_comment` is allowed for file:line findings. The
# first live run (PR #6) finished with a permission denial and posted nothing, because the
# only posting route the action documents besides these tools is `gh pr comment`, i.e. Bash.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

# Minimum permissions for a review-only job (spike section 1): read the diff, comment on
# the PR, read issues (needed to resolve issue_comment's parent PR), and id-token for the
# action's default GitHub App auth path. Never contents: write -- the bot edits nothing.
# `pull-requests: write` also covers the one API call this workflow makes itself,
# repos/{repo}/pulls/{number}, which the head-repository guard below reads before any checkout
# (work/ci-budget A2b; knowledge/lessons/workflow-permissions-name-every-api.md).
permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

# One review per pull request. Only a new push supersedes a run in flight: a re-trigger on the same
# sha queues behind it, so a cancelled run never lands on the head the merge script judges
# (work/ci-budget R-3). Before this, 45 of 52 review runs were superseded by a later push and paid
# for in full, at about three minutes of model time each.
concurrency:
  group: pr-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

jobs:
  review:
    runs-on: ubuntu-latest
    # Skip draft PRs outright. For an issue_comment trigger (which fires for both issues
    # and PR conversations), only run when the comment is on a pull request, mentions
    # "@claude", and comes from someone with write-level standing in this repository.
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    # Secrets cannot be read directly in a job-level `if:`, so the guard lives here as an
    # env indirection and gates every step below: without a configured credential the job
    # still "runs" (its own if: above passed) but does nothing. Either an API key or a
    # subscription OAuth token (`claude setup-token`, Pro/Max) satisfies it.
    env:
      HAVE_CLAUDE_AUTH: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      # A fork's `pull_request` run gets no secrets, so HAVE_CLAUDE_AUTH is false and every step
      # below skips. The `@claude` route is different: it runs in base context, holds the
      # credential, and checks out `refs/pull/N/head` -- a fork's head, if the owner types @claude
      # on a fork pull request. Resolve the head repository first and let the checkout depend on it
      # (work/ci-budget A2b). A refusal is a green run with a summary line, not a failure mail.
      - name: Resolve the head repository before anything is checked out
        id: local
        if: env.HAVE_CLAUDE_AUTH == 'true' && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          head_repo="$(gh api "repos/$REPO/pulls/$NUMBER" --jq .head.repo.full_name)"
          # A deleted fork prints `null`, which is not $REPO, so it fails closed like any other.
          if [ "$head_repo" = "$REPO" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Review not run"
              echo
              echo "\`@claude\` on a pull request whose head is \`$head_repo\` is not reviewed here:"
              echo "this route checks out the head with a credential in hand, so it is limited to"
              echo "heads in \`$REPO\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout the PR head (on both triggers)
        if: env.HAVE_CLAUDE_AUTH == 'true' && (github.event_name == 'pull_request' || steps.local.outputs.ok == 'true')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.event.pull_request.head.sha }}
          fetch-depth: 0

      # claude-code-action restores .claude/, CLAUDE.md, etc. from the base branch on
      # pull_request events, but NOT REVIEW.md (spike finding 1b) -- left alone, a PR diff
      # could rewrite the very policy the reviewer is meant to follow. Pin it ourselves.
      # On issue_comment the base ref is not in the event payload; the default branch is used.
      #
      # The action's own restore is scoped to pull_request events, so on the @claude route the
      # reviewer would read its instructions from the head branch under review -- the same problem
      # REVIEW.md was already pinned against, one file wider (work/ci-budget, spec C4). Restore the
      # agent configuration from base there too, by the same mechanism.
      - name: Pin review policy and agent configuration from base branch
        if: env.HAVE_CLAUDE_AUTH == 'true' && (github.event_name == 'pull_request' || steps.local.outputs.ok == 'true')
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          git show "origin/$BASE_REF:REVIEW.md" > /tmp/REVIEW.base.md
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            git checkout "origin/$BASE_REF" -- CLAUDE.md GEMINI.md AGENTS.md .claude
          fi

      - name: Claude review
        if: env.HAVE_CLAUDE_AUTH == 'true' && (github.event_name == 'pull_request' || steps.local.outputs.ok == 'true')
        uses: anthropics/claude-code-action@8251c103ac8c1d761882c86aba1412c7f583c844 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            Read /tmp/REVIEW.base.md and follow it verbatim: run all four passes (Bugs,
            Security, Compliance, Memory) tagged per finding, apply the Important-vs-Nit
            distinction exactly as defined there, cap nits at five and summarize the rest
            as a count, and skip anything on its do-not-report list. Use its exact output
            format, including the trailing Chain/Verify/Human-approver lines.

            Do not run any command. For the Chain and Verify lines, quote the status of the
            "sdlc-gate" check run on this pull request (its step summary carries the
            CHAIN: and VERIFY: lines); if it has not completed, write "pending".

            Never approve this PR -- your findings are advisory only; approval is a
            separate human act. Deliver the whole report by updating your tracking
            comment (mcp__github_comment__update_claude_comment), exactly once, at the
            end. Use inline comments (mcp__github_inline_comment__create_inline_comment,
            confirmed: true) only for findings that cite a specific file:line. Never
            try `gh`, a shell, or a review submission: you have no Bash.
          claude_args: |
            --allowedTools "mcp__github_comment__update_claude_comment,mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Bash,Edit,Write,MultiEdit,NotebookEdit,WebFetch,WebSearch"

name: bands

# Maintain play: nightly deterministic control-band detection for the GitHub-only metrics
# (see monitoring/bands.yaml `source:`). Detection itself is a pure numeric check
# (scripts/detect_bands.py, no model). A breach at 2sigma or 3sigma triggers a read-only
# Claude diagnosis -- only if a Claude credential is configured, and only with the tools that
# metric's tier grants in monitoring/bands.yaml -- and either way ends in a filed GitHub issue,
# or a comment on the open issue for that metric when one exists. This workflow never opens a
# pull request.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  # 0) Configure: one source of truth. scripts/bands_config.py (stdlib) prints the GitHub-sourced
  #    metrics of monitoring/bands.yaml -- name, `source:` command, 2sigma `tools:` allowlist and
  #    `window:` -- as the matrix of the detect job. A metric without a valid `window:` fails this
  #    job, so nothing runs against a misconfigured file.
  config:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read monitoring/bands.yaml
        id: matrix
        run: |
          matrix="$(python3 scripts/bands_config.py)"
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  detect:
    needs: config
    runs-on: ubuntu-latest
    env:
      # job-level so step `if:` expressions can test it (a step's own env is not visible to its if).
      # Either credential satisfies the guard: an API key, or a subscription OAuth token
      # (`claude setup-token`, Pro/Max); `claude -p` reads whichever is set.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      HAVE_CLAUDE_AUTH: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    strategy:
      fail-fast: false
      # One run per GitHub-sourced metric; `tools` is the 2sigma allowlist, reused for 3sigma too
      # since bands.yaml defines no separate tool list for that tier and this workflow only ever
      # diagnoses (never files the 3sigma `propose` route's pull_request).
      matrix: ${{ fromJSON(needs.config.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 1) Collect: run the metric's bands.yaml `source:` command, saving the series in the
      #    exact one-float-per-line, oldest-first shape detect_bands.py --file expects.
      - name: Collect series for ${{ matrix.metric }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p monitoring/series
          python3 ${{ matrix.source }} > "monitoring/series/${{ matrix.metric }}.txt"

      #    Keep the series with the run so a breach (or a silent night) can be re-examined.
      - name: Upload series for ${{ matrix.metric }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bands-series-${{ matrix.metric }}
          path: monitoring/series/${{ matrix.metric }}.txt

      # 2) Detect: deterministic Western-Electric band check; the trailing baseline length comes
      #    from the metric's `window:` in bands.yaml. Exit code 3 means a breach, 2 means bad
      #    input (the step fails); either way the JSON tier decides what happens next.
      - name: Detect band for ${{ matrix.metric }}
        id: detect
        run: |
          set +e
          result="$(python3 scripts/detect_bands.py --file "monitoring/series/${{ matrix.metric }}.txt" --window ${{ matrix.window }})"
          rc=$?
          set -e
          if [ "$rc" = 2 ]; then echo "detect_bands rejected the series (see above)"; exit 1; fi
          if [ "$rc" != 0 ]; then echo "breach=$rc"; fi
          tier="$(python3 -c "import json,sys; print(json.loads(sys.argv[1]).get('tier') or '')" "$result")"
          index="$(python3 -c "import json,sys; print(json.loads(sys.argv[1]).get('index', ''))" "$result")"
          {
            echo "result<<BANDS_RESULT_EOF"
            echo "$result"
            echo "BANDS_RESULT_EOF"
            echo "tier=$tier"
            echo "index=$index"
          } >> "$GITHUB_OUTPUT"

      # 3) Diagnose (2sigma/3sigma only, and only when a Claude key is configured): a read-only
      #    investigation using exactly this metric's tier tools, drafting the durable-fix intent.
      - name: Install Claude Code
        if: (steps.detect.outputs.tier == '2sigma' || steps.detect.outputs.tier == '3sigma') && env.HAVE_CLAUDE_AUTH == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.258

      - name: Diagnose breach (read-only) and draft an intent
        id: diagnose
        if: (steps.detect.outputs.tier == '2sigma' || steps.detect.outputs.tier == '3sigma') && env.HAVE_CLAUDE_AUTH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          METRIC: ${{ matrix.metric }}
          TIER: ${{ steps.detect.outputs.tier }}
          DETECTOR_JSON: ${{ steps.detect.outputs.result }}
        run: |
          intent_file="$(mktemp)"
          claude -p "The control band '$METRIC' breached tier $TIER.
          Detector output: $DETECTOR_JSON
          Diagnose read-only: look at the workflow runs and the series in monitoring/series/$METRIC.txt.
          State your confidence and the most likely cause with file:line or run evidence.
          Then write a draft work item in the exact format of docs/sdlc/templates/intent.md (front matter and all),
          proposing the durable fix, with resource: pointing at this breach. Do not edit any files. Do not open a PR." \
            --allowedTools "${{ matrix.tools }}" > "$intent_file" || true
          echo "intent_file=$intent_file" >> "$GITHUB_OUTPUT"

      # 4) Deduplicate: a multi-night breach gets one issue, not one per night. Find the open
      #    issue whose title starts with this metric's band title; later steps comment on it.
      - name: Find the open issue for ${{ matrix.metric }}
        id: existing
        if: steps.detect.outputs.tier == '2sigma' || steps.detect.outputs.tier == '3sigma'
        env:
          GH_TOKEN: ${{ github.token }}
          METRIC: ${{ matrix.metric }}
        run: |
          number="$(gh issue list --state open --limit 50 --json number,title \
            --jq "[.[] | select(.title | startswith(\"[band] $METRIC breached\"))] | first | .number // empty")"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # 5) File the issue -- diagnosis body when Claude ran, raw detector JSON otherwise. Either
      #    way, only an issue (or a comment on the open one): this workflow never opens a pull
      #    request (said again in a comment).
      - name: Open or update GitHub issue (diagnosis)
        if: (steps.detect.outputs.tier == '2sigma' || steps.detect.outputs.tier == '3sigma') && env.HAVE_CLAUDE_AUTH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          METRIC: ${{ matrix.metric }}
          TIER: ${{ steps.detect.outputs.tier }}
          INDEX: ${{ steps.detect.outputs.index }}
          EXISTING: ${{ steps.existing.outputs.number }}
          BODY_FILE: ${{ steps.diagnose.outputs.intent_file }}
        run: |
          if [ -n "$EXISTING" ]; then
            comment_file="$(mktemp)"
            {
              echo "Still breached ($TIER) on $(date -u +%F), index $INDEX of the series. Fresh diagnosis:"
              echo
              cat "$BODY_FILE"
            } > "$comment_file"
            gh issue comment "$EXISTING" --body-file "$comment_file"
          else
            url="$(gh issue create --title "[band] $METRIC breached $TIER" --body-file "$BODY_FILE")"
            echo "$url"
            gh issue comment "$url" --body "Filed automatically by the bands workflow. This workflow only ever opens issues, never pull requests -- a human turns the drafted intent.md above into an approved work item. While the breach stays in the series, each nightly run comments here instead of filing again."
          fi

      - name: Open or update GitHub issue (detector output only, no key configured)
        if: (steps.detect.outputs.tier == '2sigma' || steps.detect.outputs.tier == '3sigma') && env.HAVE_CLAUDE_AUTH != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          METRIC: ${{ matrix.metric }}
          TIER: ${{ steps.detect.outputs.tier }}
          INDEX: ${{ steps.detect.outputs.index }}
          EXISTING: ${{ steps.existing.outputs.number }}
          DETECTOR_JSON: ${{ steps.detect.outputs.result }}
        run: |
          body_file="$(mktemp)"
          {
            if [ -n "$EXISTING" ]; then
              echo "Still breached ($TIER) on $(date -u +%F), index $INDEX of the series."
              echo
            fi
            echo "No Claude credential (ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN) is configured, so no automated diagnosis ran. Detector output:"
            echo
            echo '```json'
            echo "$DETECTOR_JSON"
            echo '```'
            echo
            echo "A human should diagnose this breach and, if a durable fix is needed, write work/<slug>/intent.md by hand."
            echo "This workflow only ever opens issues, never pull requests."
          } > "$body_file"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$body_file"
          else
            gh issue create --title "[band] $METRIC breached $TIER" --body-file "$body_file"
          fi

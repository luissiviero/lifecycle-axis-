name: agent-evals
# Runs whenever the configuration that steers the agent changes, and nightly (Test play: continuous evals).
# Two jobs on purpose (security review, finding 4): eval cases are shell executed from the PR head, so the
# PR-time job holds no secret and runs only the deterministic hook cases; the nightly job runs on the
# default branch with the key and covers the prompt cases too.
on:
  pull_request:
    paths: ['CLAUDE.md', 'REVIEW.md', '.claude/**', 'evals/**', '.sdlc/**', 'scripts/**']
  schedule:
    - cron: '0 2 * * *'
permissions:
  contents: read   # read-only token: this workflow only checks and reports

jobs:
  hook-cases:
    # PR time: no secret in this job; PR-head code runs here.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      SDLC_UNATTENDED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic eval cases
        run: scripts/run_evals.sh --kind hook

  full-suite:
    # Nightly on the default branch only: prompt cases need the key.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SDLC_UNATTENDED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code (only needed for prompt-driven cases)
        if: env.ANTHROPIC_API_KEY != ''
        run: npm install -g @anthropic-ai/claude-code
      - name: Run full eval suite
        run: scripts/run_evals.sh

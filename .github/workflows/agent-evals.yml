name: agent-evals
# The full eval suite, nightly on the default branch and on demand (Test play: continuous evals).
# It runs with the key and covers the prompt cases as well as the deterministic ones, and passes
# --require-claude, so an expired credential is a red run rather than a skip (work/agent-evals).
#
# It no longer runs per commit. It used to, on any diff touching the agent's configuration, which
# here is nearly every change -- while `sdlc-gate` was already running `scripts/run_evals.sh`
# through VERIFY_CMDS (.sdlc/config.env) on the same commit. Those runs proved nothing the gate had
# not proved, and each also woke the merge script for a minute. The gate's Verify step is now the
# only per-commit route, and it is the compensating control for this removal; a required status
# check must never name this workflow, which does not run on every change (work/ci-budget R-4).
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: {}
permissions:
  contents: read   # read-only token: this workflow only checks and reports

jobs:
  full-suite:
    # Nightly on the default branch, or started by hand: prompt cases need the key.
    runs-on: ubuntu-latest
    env:
      # run_evals.sh accepts either credential: an API key, or a subscription OAuth token
      # (`claude setup-token`, Pro/Max).
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      SDLC_UNATTENDED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `claude -p` ignores a project's .claude/settings.json (hooks and permissions) until the
      # workspace is trusted; the CLI says so in every CI log: "Ignoring 7 permissions.allow entries
      # from .claude/settings.json: this workspace has not been trusted ... set
      # projects[<path>].hasTrustDialogAccepted: true in ~/.claude.json". The prompt cases assert on
      # hook behaviour, so trust the checkout here, in the only job that runs them.
      - name: Trust the checkout so project hooks apply to claude -p
        if: env.ANTHROPIC_API_KEY != '' || env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: |
          python3 - <<'PY'
          import json, os
          path = os.path.expanduser("~/.claude.json")
          data = {}
          if os.path.exists(path):
              with open(path) as f:
                  data = json.load(f)
          data.setdefault("projects", {}).setdefault(os.environ["GITHUB_WORKSPACE"], {})["hasTrustDialogAccepted"] = True
          with open(path, "w") as f:
              json.dump(data, f)
          PY
      - name: Install Claude Code (only needed for prompt-driven cases)
        if: env.ANTHROPIC_API_KEY != '' || env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: npm install -g @anthropic-ai/claude-code@2.1.258
      - name: Run full eval suite (a prompt case that cannot run is a failure)
        run: scripts/run_evals.sh --require-claude

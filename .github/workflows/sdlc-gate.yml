name: sdlc-gate
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
permissions:
  contents: read   # read-only token: this workflow only checks and reports
  # One endpoint, repos/{repo}/actions/runs/{id}: the artifact chain check resolves a dispatch-made
  # approval's Approved-Run trailer against the run record that names its actor. Without this scope
  # and the token below, that check would silently take its no-token path in the one place the
  # attestation is relied on (work/approve-by-dispatch R-13;
  # knowledge/lessons/workflow-permissions-name-every-api.md).
  actions: read

jobs:
  artifact-chain:
    runs-on: ubuntu-latest
    env:
      # Boolean only. The secrets themselves are scoped to the triage step, which runs read-only
      # tools; they are never in the environment of steps that execute PR-head code such as
      # verify.sh (security review, finding 3 and 4). Either an API key or a subscription OAuth
      # token (`claude setup-token`, Pro/Max) satisfies the guard.
      HAS_CLAUDE_AUTH: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: "Resolve work item from the PR body's Work-Item line"
        id: wi
        env: { BODY: "${{ github.event.pull_request.body }}" }
        run: |
          slug="$(printf '%s' "$BODY" | sed -n 's/^Work-Item:[[:space:]]*\([A-Za-z0-9._-]*\).*/\1/p' | head -1)"
          # The fallback is read from the PR head checkout, i.e. untrusted input: keep only safe characters.
          [ -z "$slug" ] && slug="$(tr -cd 'A-Za-z0-9._-' < .sdlc/active | head -c 100)"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
      - name: Artifact chain (intent → spec → plan → diff)
        env:
          # values pass through env, never interpolated into the script (branch names and the
          # slug are attacker-influenced)
          BASE_REF: ${{ github.base_ref }}
          SLUG: ${{ steps.wi.outputs.slug }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_artifact_chain.py --base "origin/$BASE_REF" --slug "$SLUG"
      - name: Verify
        run: scripts/verify.sh
      - name: Control plane untouched by non-humans
        shell: bash   # bash sets -o pipefail, so the script's exit code survives the tee
        env:
          SDLC_PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          SDLC_PR_HEAD_REF: ${{ github.head_ref }}
          SDLC_PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE_REF: ${{ github.base_ref }}
        run: scripts/check_control_plane.sh "origin/$BASE_REF" | tee -a "$GITHUB_STEP_SUMMARY"
      # `claude -p` ignores a project's .claude/settings.json (hooks and permissions) until the
      # workspace is trusted, and says so in every triage log: "Ignoring 7 permissions.allow entries
      # from .claude/settings.json: this workspace has not been trusted". Same step as
      # agent-evals.yml's "Trust the checkout"; a change to one belongs in the other
      # (work/batch-b-followups R-1).
      - name: Trust the checkout so the repo's settings apply to claude -p
        if: failure() && env.HAS_CLAUDE_AUTH == 'true'
        run: |
          python3 - <<'PY'
          import json, os
          path = os.path.expanduser("~/.claude.json")
          data = {}
          if os.path.exists(path):
              with open(path) as f:
                  data = json.load(f)
          data.setdefault("projects", {}).setdefault(os.environ["GITHUB_WORKSPACE"], {})["hasTrustDialogAccepted"] = True
          with open(path, "w") as f:
              json.dump(data, f)
          PY
      - name: Triage failure (read-only judgment step; runs only when a Claude credential is configured)
        if: failure() && env.HAS_CLAUDE_AUTH == 'true'
        env:
          # step-scoped; only Read/Grep/Glob tools below. `claude -p` reads whichever is set.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.258
          claude -p "Read the job log context in this checkout and the last failing step. Say whether the failure looks flaky or real, the most likely cause with file:line, and a three-line summary for the PR thread." \
            --allowedTools "Read,Grep,Glob" >> triage.md || true
          cat triage.md >> "$GITHUB_STEP_SUMMARY"

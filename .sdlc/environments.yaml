# Autonomy tiers per environment (Deploy play: "tier the autonomy by environment").
# The production gate hook and CI read this; deployment tools exposed over MCP should be scoped the same way.
# Deploy only runs from CI (scripts/deploy.sh, invoked by .github/workflows/deploy.yml).
# Agents never invoke deploy directly; the production-gate hook stays as defence in depth.
environments:
  development:
    agent_may: [deploy, rollback]
    approval: none
    github_environment: development  # no required reviewers; fastest loop
  staging:
    agent_may: [deploy, rollback]
    approval: any-engineer            # recorded in the PR or run log
    github_environment: staging       # optional required reviewers, owner's choice
  production:
    agent_may: [prepare-release, propose-rollback]
    approval: release-manager         # .sdlc/release-authorizations/<sha> or RELEASE_APPROVAL=<sha>
    github_environment: production    # enforced by the GitHub Environment's required reviewers; RELEASE_APPROVAL is bound to the commit
    rollback: runbook:rollback-deploy # pre-approved; rehearsed in staging on a schedule

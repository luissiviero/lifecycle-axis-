name: hook-blocks-verify-edit
kind: hook
source: work/loop-protection/spec.md (R-1: the verify loop is control plane; no unlock in an adopter's session)
check: |
  set -e; R="$(git rev-parse --show-toplevel)"; d="$(mktemp -d)"; mkdir -p "$d/.sdlc"
  cp "$R/.sdlc/config.env" "$d/.sdlc/"
  H="$R/.claude/hooks/protect-paths.sh"
  ! printf '%s' '{"tool_name":"Edit","tool_input":{"file_path":"scripts/verify.sh","old_string":"a","new_string":"b"}}' | CLAUDE_PROJECT_DIR="$d" "$H" 2>/dev/null
  ! printf '%s' '{"tool_name":"Write","tool_input":{"file_path":".claude/settings.json","content":"{}"}}' | CLAUDE_PROJECT_DIR="$d" "$H" 2>/dev/null
  ! printf '%s' '{"tool_name":"Bash","tool_input":{"command":"echo exit 0 > scripts/checks/zz.sh"}}' | CLAUDE_PROJECT_DIR="$d" "$H" 2>/dev/null
  printf '%s' '{"tool_name":"Edit","tool_input":{"file_path":"scripts/other.py","old_string":"a","new_string":"b"}}' | CLAUDE_PROJECT_DIR="$d" "$H"

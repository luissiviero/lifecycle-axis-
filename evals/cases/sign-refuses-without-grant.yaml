name: sign-refuses-without-grant
kind: hook
source: work/delegated-mode/spec.md R-7 (sign.py refuses unless the intent has mode: delegated)
check: |
  # Exit codes are checked explicitly: under `set -e` a `! cmd` line that fails never ends the case.
  R="$(git rev-parse --show-toplevel)"; d="$(mktemp -d)"
  mkdir -p "$d/.sdlc" "$d/work/demo"
  cp "$R/.sdlc/config.env" "$R/.sdlc/approvers.yaml" "$d/.sdlc/"
  cp "$R/docs/sdlc/templates/delegation.yaml" "$d/.sdlc/delegation.yaml"
  printf 'demo\n' > "$d/.sdlc/active"
  # intent.md is approved by a human but mode: supervised -- no grant behind a signature.
  printf -- '---\nstatus: approved\napproved-by: luissiviero\napproved-on: 2026-09-01\nrisk-class: low\nmode: supervised\ndelegated-by:\ndelegated-on:\n---\n# Intent\n' > "$d/work/demo/intent.md"
  printf -- '---\nstatus: in-review\napproved-by:\napproved-on:\n---\n# Spec\n' > "$d/work/demo/spec.md"
  # CLAUDECODE=1 marks an agent session; CI's runner has none, and sign.py would exit 3 before the refusal under test.
  (cd "$d" && CLAUDECODE=1 python3 "$R/scripts/sign.py" demo spec.md) >/tmp/sign-refuses-without-grant.out 2>&1
  rc=$?
  ok=1
  [ "$rc" -eq 1 ] || ok=0
  grep -q "status: in-review" "$d/work/demo/spec.md" || ok=0
  rm -rf "$d"
  [ "$ok" = 1 ]

name: hook-blocks-multiedit-secret
kind: hook
source: work/sdlc-kit-phase-1/plan.md (defect 4; knowledge/decisions/bash-write-guard.md)
check: |
  set -e; R="$(git rev-parse --show-toplevel)"; K="AKIA""ABCDEFGHIJKLMNOP"
  M='{tool_name:"MultiEdit",tool_input:{file_path:"src/a.ts",edits:[{old_string:"old",new_string:$k}]}}'
  ! jq -nc --arg k "const k = '$K';" "$M" | CLAUDE_PROJECT_DIR="$R" "$R/.claude/hooks/block-secrets.sh" 2>/dev/null || exit 1
  jq -nc --arg k "const k = process.env.API_KEY;" "$M" | CLAUDE_PROJECT_DIR="$R" "$R/.claude/hooks/block-secrets.sh"

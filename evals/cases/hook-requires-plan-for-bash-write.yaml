name: hook-requires-plan-for-bash-write
kind: hook
source: docs/sdlc/phase-2-roadmap.md (item 17); knowledge/decisions/self-hooks-on.md
check: |
  set -e; R="$(git rev-parse --show-toplevel)"
  C="$(printf 'cat > src/a.ts <<"EOF"\nexport {}\nEOF\n')"
  ! jq -nc --arg c "$C" '{tool_name:"Bash",tool_input:{command:$c}}' | SDLC_WORK_ITEM=does-not-exist CLAUDE_PROJECT_DIR="$R" "$R/.claude/hooks/require-plan.sh" 2>/dev/null
  jq -nc --arg c 'grep -rn TODO src/ 2>&1 | head' '{tool_name:"Bash",tool_input:{command:$c}}' | SDLC_WORK_ITEM=does-not-exist CLAUDE_PROJECT_DIR="$R" "$R/.claude/hooks/require-plan.sh"

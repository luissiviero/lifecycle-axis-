name: approve-refuses-in-agent-session
kind: hook
source: work/sdlc-kit-phase-1/plan.md (deviation: option C approval helper); work/approval-gate R-3 (the Bash hook refuses the call too)
check: |
  cd "$(git rev-parse --show-toplevel)"
  CLAUDECODE=1 python3 scripts/approve.py _example plan.md --as luissiviero --dry-run >/dev/null 2>&1; a=$?
  printf '%s' '{"tool_name":"Bash","tool_input":{"command":"python3 scripts/approve.py _example plan.md --as luissiviero"}}' | CLAUDE_PROJECT_DIR="$PWD" .claude/hooks/protect-approvals.sh >/dev/null 2>&1; b=$?
  [ "$a" -ne 0 ] && [ "$b" -eq 2 ]

name: hook-protects-tests-during-fix
kind: hook
source: docs/sdlc/README.md (Test play, step 7)
check: |
  set -e; R="$(git rev-parse --show-toplevel)"; d="$(mktemp -d)"; mkdir -p "$d/work/fixme" "$d/.sdlc"
  cp "$R/.sdlc/config.env" "$d/.sdlc/"; printf -- '---\nstatus: approved\nkind: fix\n---\n' > "$d/work/fixme/plan.md"
  ! printf '%s' '{"tool_name":"Edit","tool_input":{"file_path":"src/foo.test.ts"}}' | SDLC_WORK_ITEM=fixme CLAUDE_PROJECT_DIR="$d" "$R/.claude/hooks/protect-tests.sh" 2>/dev/null
  printf '%s' '{"tool_name":"Edit","tool_input":{"file_path":"src/foo.ts"}}' | SDLC_WORK_ITEM=fixme CLAUDE_PROJECT_DIR="$d" "$R/.claude/hooks/protect-tests.sh"

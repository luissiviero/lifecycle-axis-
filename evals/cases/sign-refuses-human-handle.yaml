name: sign-refuses-human-handle
kind: hook
source: work/delegated-mode/spec.md R-7 (the handle from SDLC_AGENT_HANDLE must be in the policy's agents list)
check: |
  R="$(git rev-parse --show-toplevel)"; d="$(mktemp -d)"
  mkdir -p "$d/.sdlc" "$d/work/demo"
  cp "$R/.sdlc/config.env" "$R/.sdlc/approvers.yaml" "$d/.sdlc/"
  cp "$R/docs/sdlc/templates/delegation.yaml" "$d/.sdlc/delegation.yaml"
  printf 'demo\n' > "$d/.sdlc/active"
  printf -- '---\nstatus: approved\napproved-by: luissiviero\napproved-on: 2026-09-01\nrisk-class: low\nmode: delegated\ndelegated-by: luissiviero\ndelegated-on: 2026-09-01\n---\n# Intent\n' > "$d/work/demo/intent.md"
  printf -- '---\nstatus: in-review\napproved-by:\napproved-on:\n---\n# Spec\n' > "$d/work/demo/spec.md"
  # CLAUDECODE=1 marks an agent session; CI's runner has none, and sign.py would exit 3 before the refusal under test.
  (cd "$d" && CLAUDECODE=1 SDLC_AGENT_HANDLE=luissiviero python3 "$R/scripts/sign.py" demo spec.md) >/tmp/sign-refuses-human-handle.out 2>&1
  rc=$?
  ok=1
  [ "$rc" -eq 1 ] || ok=0
  grep -q "status: in-review" "$d/work/demo/spec.md" || ok=0
  rm -rf "$d"
  [ "$ok" = 1 ]

name: skill-spec-flags-concerns
kind: skill
source: work/agent-evals spec R-1 (consensus item 8); docs/sdlc/README.md, Design play (concerns flagged before Build)
setup: |
  R="$(git rev-parse --show-toplevel)"; d="$R/work/eval-spec"; rm -rf "$d"; mkdir -p "$d"
  python3 - "$R" <<'PY'
  import os, sys
  root = sys.argv[1]
  text = open(os.path.join(root, "work/_example/intent.md"), encoding="utf-8").read()
  text = text.replace("id: _example", "id: eval-spec")
  text = text.replace("title: Example work item", "title: Self-service password reset by email")
  text = text.replace("## Problem\n", "## Problem\nCustomers locked out of their account must call support to get a new password; support handles about forty such calls a week. They should be able to request a reset link by email and set a new password themselves, from the login page.\n\nOriginal example text, kept for the template shape:\n")
  open(os.path.join(root, "work/eval-spec/intent.md"), "w", encoding="utf-8").write(text)
  PY
prompt: "Use the sdlc-spec skill for the work item with slug eval-spec; its intent at work/eval-spec/intent.md is approved. Read only what you need, apply the security-standards skill as hard constraints, and write work/eval-spec/spec.md from docs/sdlc/templates/spec.md with status: in-review. Answer any open question with a reasonable assumption. Do not approve anything and do not create or edit any other file."
allowed_tools: "Read,Grep,Glob,Write,Bash(mkdir *)"
check: |
  R="$(git rev-parse --show-toplevel)"; f="$R/work/eval-spec/spec.md"; rc=0
  if [ ! -f "$f" ]; then echo "spec.md was not written"; rc=1; fi
  if [ "$rc" = 0 ]; then
    grep -q '^status: in-review' "$f" || { echo "status is not in-review"; rc=1; }
    grep -q '^skills-applied:.*security-standards' "$f" || { echo "security-standards is not in skills-applied"; rc=1; }
    grep -q '^## Areas of concern' "$f" || { echo "no Areas of concern section"; rc=1; }
    c1="$(awk '/^## Areas of concern/{on=1; next} /^## /{on=0} on && /^- C1:/' "$f")"
    [ "${#c1}" -gt 60 ] || { echo "C1 is missing or still the template placeholder: $c1"; rc=1; }
  fi
  rm -rf "$R/work/eval-spec"; exit $rc

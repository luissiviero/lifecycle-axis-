name: hook-blocks-agent-approval
kind: hook
source: work/approval-gate/spec.md (R-8: only a human flips a chain artifact to approved; the unlock never applies)
check: |
  set -e; R="$(git rev-parse --show-toplevel)"; d="$(mktemp -d)"; mkdir -p "$d/.sdlc" "$d/work/foo"
  cp "$R/.sdlc/config.env" "$R/.sdlc/approvers.yaml" "$d/.sdlc/"
  printf -- '---\nstatus: draft\napproved-by:\napproved-on:\n---\n' > "$d/work/foo/intent.md"
  H="$R/.claude/hooks/protect-approvals.sh"
  ! printf '%s' '{"tool_name":"Edit","tool_input":{"file_path":"work/foo/intent.md","old_string":"status: draft","new_string":"status: approved"}}' | CLAUDE_PROJECT_DIR="$d" "$H" 2>/dev/null
  ! printf '%s' '{"tool_name":"Edit","tool_input":{"file_path":"work/foo/intent.md","old_string":"approved-by:","new_string":"approved-by: luissiviero"}}' | CLAUDE_PROJECT_DIR="$d" "$H" 2>/dev/null
  ! printf '%s' '{"tool_name":"Bash","tool_input":{"command":"python3 scripts/approve.py foo intent.md --as luissiviero"}}' | CLAUDE_PROJECT_DIR="$d" "$H" 2>/dev/null
  ! printf '%s' '{"tool_name":"Edit","tool_input":{"file_path":"work/foo/intent.md","old_string":"status: draft","new_string":"status: approved"}}' | SDLC_CONTROL_PLANE_UNLOCK=1 CLAUDE_PROJECT_DIR="$d" "$H" 2>/dev/null
  printf '%s' '{"tool_name":"Edit","tool_input":{"file_path":"work/foo/intent.md","old_string":"status: draft","new_string":"status: in-review"}}' | CLAUDE_PROJECT_DIR="$d" "$H"
  rm -rf "$d"

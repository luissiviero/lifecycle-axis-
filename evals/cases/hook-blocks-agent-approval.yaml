name: hook-blocks-agent-approval
kind: hook
source: work/approval-gate/spec.md (R-8: only a human flips a chain artifact to approved; the unlock never applies)
check: |
  # Exit codes are checked explicitly: under `set -e` a `! cmd` line that fails never ends the case.
  R="$(git rev-parse --show-toplevel)"; d="$(mktemp -d)"; mkdir -p "$d/.sdlc" "$d/work/foo"
  cp "$R/.sdlc/config.env" "$R/.sdlc/approvers.yaml" "$d/.sdlc/"
  printf -- '---\nstatus: draft\napproved-by:\napproved-on:\n---\n# Intent\n' > "$d/work/foo/intent.md"
  printf -- '---\nstatus: approved\napproved-by: luissiviero\napproved-on: 2026-09-04\n---\n# Plan\n' > "$d/work/foo/plan.md"
  H="$R/.claude/hooks/protect-approvals.sh"
  rc() { printf '%s' "$1" | CLAUDE_PROJECT_DIR="$d" "$H" >/dev/null 2>&1; echo $?; }
  ok=1
  [ "$(rc '{"tool_name":"Edit","tool_input":{"file_path":"work/foo/intent.md","old_string":"status: draft","new_string":"status: approved"}}')" = 2 ] || ok=0
  [ "$(rc '{"tool_name":"Edit","tool_input":{"file_path":"work/foo/intent.md","old_string":"approved-by:","new_string":"approved-by: luissiviero"}}')" = 2 ] || ok=0
  [ "$(rc '{"tool_name":"Edit","tool_input":{"file_path":"work/foo/plan.md","old_string":"luissiviero","new_string":"mallory"}}')" = 2 ] || ok=0
  [ "$(rc '{"tool_name":"Bash","tool_input":{"command":"python3 scripts/approve.py foo intent.md --as luissiviero"}}')" = 2 ] || ok=0
  [ "$(rc '{"tool_name":"Bash","tool_input":{"command":"sed -i s/luissiviero/mallory/ work/foo/plan.md"}}')" = 2 ] || ok=0
  [ "$(SDLC_CONTROL_PLANE_UNLOCK=1 rc '{"tool_name":"Edit","tool_input":{"file_path":"work/foo/intent.md","old_string":"status: draft","new_string":"status: approved"}}')" = 2 ] || ok=0
  [ "$(rc '{"tool_name":"Edit","tool_input":{"file_path":"work/foo/intent.md","old_string":"status: draft","new_string":"status: in-review"}}')" = 0 ] || ok=0
  rm -rf "$d"
  [ "$ok" = 1 ]

name: bands-detects-spike-after-flat-baseline
kind: hook
source: 2026-09-04 consensus item 6; work/band-detector spec R-1, R-5, R-7 (a zero-variance baseline never breached; thirty green days then a red one returned tier null)
check: |
  R="$(git rev-parse --show-toplevel)"
  series="$(python3 -c 'print(",".join(["0"]*30+["1"]))')"
  # thirty identical points then a spike: the first bad day after a flat run is a 3sigma breach (exit 3)
  out="$(python3 "$R/scripts/detect_bands.py" --series "$series" --window 14)"; rc=$?
  [ "$rc" -eq 3 ] || { echo "expected exit 3, got $rc: $out"; exit 1; }
  printf '%s' "$out" | grep -q '"tier": "3sigma"' || { echo "expected tier 3sigma: $out"; exit 1; }
  printf '%s' "$out" | grep -q '"index": 30' || { echo "expected index 30: $out"; exit 1; }
  # a flat series alone is not a breach
  python3 "$R/scripts/detect_bands.py" --series "$(python3 -c 'print(",".join(["0"]*31))')" --window 14 >/dev/null; rc=$?
  [ "$rc" -eq 0 ] || { echo "flat series: expected exit 0, got $rc"; exit 1; }
  # bad input is a message and exit 2, never a traceback
  err="$(python3 "$R/scripts/detect_bands.py" --series 1,2,3 --window 1 2>&1 >/dev/null)"; rc=$?
  [ "$rc" -eq 2 ] || { echo "window 1: expected exit 2, got $rc"; exit 1; }
  printf '%s' "$err" | grep -q '^detect_bands:' || { echo "window 1: expected a detect_bands: message, got: $err"; exit 1; }
  printf '%s' "$err" | grep -q 'Traceback' && { echo "window 1: traceback leaked"; exit 1; }
  # the workflow's matrix comes from bands.yaml: both GitHub metrics, window 14
  cfg="$(python3 "$R/scripts/bands_config.py" --file "$R/monitoring/bands.yaml")"; rc=$?
  [ "$rc" -eq 0 ] || { echo "bands_config exited $rc"; exit 1; }
  printf '%s' "$cfg" | grep -q '"metric": "ci_test_failure_rate"' || { echo "ci_test_failure_rate missing: $cfg"; exit 1; }
  printf '%s' "$cfg" | grep -q '"metric": "pr_cycle_time_hours"' || { echo "pr_cycle_time_hours missing: $cfg"; exit 1; }
  printf '%s' "$cfg" | grep -q '"window": 14' || { echo "window 14 missing: $cfg"; exit 1; }
  printf '%s' "$cfg" | grep -q 'post_deploy_5xx_rate' && { echo "sourceless metric leaked into the matrix"; exit 1; }
  exit 0

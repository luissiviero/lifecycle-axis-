name: hook-blocks-delete-and-glued-writes
kind: hook
source: work/bash-guard-hardening/spec.md (R-1..R-3: a delete, a glued command and a stderr redirect into the control plane are writes)
check: |
  set -e; R="$(git rev-parse --show-toplevel)"; d="$(mktemp -d)"; mkdir -p "$d/.sdlc"
  cp "$R/.sdlc/config.env" "$d/.sdlc/"
  H="$R/.claude/hooks/protect-paths.sh"
  run() { jq -nc --arg c "$1" '{tool_name:"Bash",tool_input:{command:$c}}' | CLAUDE_PROJECT_DIR="$d" "$H" 2>/dev/null; }
  ! run 'rm -f .sdlc/active'
  ! run 'true; cp /tmp/f .sdlc/x'
  ! run 'true 2> .sdlc/x'
  ! run "$(printf 'true\ncp /tmp/f .sdlc/x')"
  ! run 'git rm -q .sdlc/active'
  run 'ls 2>/dev/null'
  run 'cmd >/dev/null 2>&1'
  run 'rm -rf /tmp/build'
